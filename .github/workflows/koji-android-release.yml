name: Build Koji APK

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Keep only the newest APK build for master running.
concurrency:
  group: koji-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build vanilla Android APK
    runs-on: ubuntu-latest
    env:
      OS: android
      TARGET: vanilla
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache native compilation
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: android-vanilla-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            android-vanilla-${{ runner.os }}-

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache apksigner zip
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmake;3.30.3"

      - name: Set release version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: echo "GIT_TAG_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Build APK only
        run: |
          set -euo pipefail
          cd src/android
          chmod +x ./gradlew
          JAVA_HOME="$JAVA_HOME_17_X64" ./gradlew --no-daemon --stacktrace assembleVanillaRelease

      - name: Find and stage APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          mapfile -t apks < <(find src/android/app/build/outputs -type f -name '*.apk' | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No APK was produced under src/android/app/build/outputs" >&2
            find src/android/app/build -type f \( -name '*.apk' -o -name '*.aab' \) -print
            exit 1
          fi
          for apk in "${apks[@]}"; do
            cp "$apk" "release-assets/Koji-${GITHUB_REF_NAME}-$(basename "$apk")"
          done
          ls -lh release-assets

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Koji-APK-${{ github.ref_name }}
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master' }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Koji {0}', github.ref_name) || format('Koji build {0}', github.run_number) }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          generate_release_notes: true
          files: release-assets/*.apk
          fail_on_unmatched_files: true
