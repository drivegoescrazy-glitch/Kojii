name: Build Koji APK

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: koji-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build vanilla Android APK
    runs-on: ubuntu-latest
    env:
      OS: android
      TARGET: vanilla
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache native compilation
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: android-vanilla-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            android-vanilla-${{ runner.os }}-

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache apksigner zip
          echo "y" | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "cmake;3.30.3"

      - name: Set release version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: echo "GIT_TAG_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Build APK
        run: JAVA_HOME="$JAVA_HOME_17_X64" ./.ci/android.sh

      - name: Find and stage APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          mapfile -t apks < <(find src/android/app/build/bundle -maxdepth 1 -type f -name '*.apk' | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No APK was produced in src/android/app/build/bundle" >&2
            find src/android/app/build -type f -name '*.apk' -print
            exit 1
          fi
          for apk in "${apks[@]}"; do
            cp "$apk" "release-assets/Koji-${GITHUB_REF_NAME}-$(basename "$apk")"
          done
          ls -lh release-assets

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Koji-APK-${{ github.ref_name }}
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish versioned GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          name: Koji ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*.apk
          fail_on_unmatched_files: true
